# Local or single-server deployment: docker compose up -d  ->  http://localhost:8000
services:
  transcribly:
    build:
      context: .
      args:
        PRELOAD_MODEL: ${PRELOAD_MODEL:-}
    image: transcribly:latest
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRANSCRIBLY_OLLAMA_URL: ${TRANSCRIBLY_OLLAMA_URL:-http://ollama:11434}
    volumes:
      - transcribly-data:/data
      - transcribly-models:/models
    restart: unless-stopped

  # Optional: local AI study notes. Start with:
  #   docker compose --profile ai up -d && docker compose exec ollama ollama pull qwen2.5:7b
  # (TRANSCRIBLY_OLLAMA_URL below already points at it). Needs ~6 GB of free RAM.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  transcribly-data:
  transcribly-models:
  ollama:
