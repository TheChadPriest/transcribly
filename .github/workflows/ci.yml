name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.lock.txt }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q
      - name: Real transcription tests (whisper base, CPU)
        env: { TRANSCRIBLY_REAL_TESTS: "1", TRANSCRIBLY_REAL_MODEL: base, TRANSCRIBLY_MODEL_DIR: /tmp/models }
        run: pytest -q tests/test_real_transcription.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: pip install -r ../backend/requirements.lock.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { E2E_PYTHON: python }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t transcribly .
      - name: Smoke test the container
        run: |
          docker run -d --name t -p 8000:8000 transcribly
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 2; done
          curl -fs http://localhost:8000/ | grep -q "Transcribly"
          docker logs t
