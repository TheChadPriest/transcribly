[project]
name = "transcribly-backend"
version = "1.0.0"
requires-python = ">=3.10,<3.14"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
